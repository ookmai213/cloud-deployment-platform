name: linux-web-infrastructure

services:
  api:
    image: ${API_IMAGE:-linux-web-api:local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-dev}
      ENABLE_API_DOCS: "false"
    expose:
      - "8000"
    networks:
      - application
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28-alpine}
    depends_on:
      api:
        condition: service_healthy
    ports: []
    networks:
      - application
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    volumes:
      - ./deploy/nginx/container-nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_SITE_CONFIG:-./deploy/nginx/container-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - ${CERTBOT_WEBROOT:-./.local/certbot-www}:/var/www/certbot:ro
      - ${CERTBOT_CONFIG:-./.local/letsencrypt}:/etc/letsencrypt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  application:
    internal: true
