name: Publish immutable image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_PUBLISH_ROLE_ARN != '' && vars.ECR_REPOSITORY_URL != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="${GITHUB_SHA}" -f branch=main -f event=push -f status=success --jq '.total_count')"
          test "$successful_runs" -gt 0

      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure short-lived AWS identity through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: linux-web-publish-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish commit-addressed image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Scan the published immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY_URL }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Report immutable release reference
        run: |
          printf 'Image: %s@%s\n' "$ECR_REPOSITORY_URL" "${{ steps.build.outputs.digest }}"
