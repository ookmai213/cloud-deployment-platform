server {
    listen 8080;
    listen [::]:8080;

    server_name localhost;
    root /var/www/linux-web-infrastructure;
    index index.html;

    server_tokens off;

    access_log /var/log/nginx/linux-web-infrastructure.access.log;
    error_log  /var/log/nginx/linux-web-infrastructure.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /favicon.ico {
        return 302 /favicon.svg;
    }

    location = /api/metrics {
        return 404;
    }

    location = /api/openapi.json {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
