upstream api_replicas {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        proxy_pass http://api_replicas/health;
    }

    location = /api/metrics {
        return 404;
    }

    location = /api/openapi.json {
        return 404;
    }

    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        proxy_pass http://api_replicas/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
