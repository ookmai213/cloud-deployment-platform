apiVersion: v1
kind: Service
metadata:
  name: linux-web-api
  namespace: linux-web
  labels:
    app.kubernetes.io/name: linux-web-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: linux-web-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
