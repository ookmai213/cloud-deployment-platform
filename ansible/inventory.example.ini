[web]
linux-web-staging ansible_host=i-REPLACE_WITH_EC2_INSTANCE_ID ansible_user=ubuntu ansible_connection=ssh ansible_ssh_private_key_file=/REPLACE/WITH/PRIVATE/KEY.pem ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ap-south-1"'

