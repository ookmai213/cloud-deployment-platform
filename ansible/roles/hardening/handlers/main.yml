---
- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Validate and reload SSH
  ansible.builtin.shell: |
    set -o pipefail
    /usr/sbin/sshd -t
    systemctl reload {{ hardening_ssh_service }}
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart systemd journal
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
